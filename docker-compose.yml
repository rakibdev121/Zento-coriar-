# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zento
      POSTGRES_PASSWORD: zento
      POSTGRES_DB: zento
    ports:
      - "5432:5432"
    volumes:
      - zento_pgdata:/var/lib/postgresql/data
volumes:
  zento_pgdata:
